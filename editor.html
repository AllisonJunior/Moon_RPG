<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#1b1224;
    color:white;
    display:block;
    height:100vh;
    padding-top:78px;
    overflow:hidden;
}

.top-nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:78px;
    background:rgba(31,21,42,0.96);
    border-bottom:2px solid #3b274d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px;
    z-index:20;
    backdrop-filter:blur(8px);
}

.nav-brand{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.nav-brand-title{
    font-size:26px;
    font-weight:bold;
    line-height:1;
}

.nav-brand-subtitle{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.65;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.module{
    height:calc(100vh - 78px);
    display:flex;
    overflow:hidden;
}

.hidden{
    display:none;
}

.sidebar{
    width:360px;
    background:#241631;
    border-right:2px solid #3b274d;
    overflow:auto;
    padding:14px;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

.section{
    background:#241631;
    border-radius:18px;
    padding:22px;
    max-width:none;
    width:100%;
}

.nav-btn{
    background:#4d2e75;
    color:#efe8ff;
    border:1px solid rgba(255,255,255,0.08);
}

.nav-btn:hover{
    background:#5b3690;
}

.nav-btn.active{
    background:#8b64de;
    border-color:rgba(255,255,255,0.22);
    box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}

.module-title{
    cursor:pointer;
    user-select:none;
}

.module-title:hover{
    color:#efe8ff;
}

button{
    border:none;
    background:#6e43a7;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    margin:4px 0;
    transition:0.15s;
}

button:hover{
    background:#8658c4;
}

.danger{
    background:#a33;
}

.danger:hover{
    background:#c44;
}

.topbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.button-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0;
}

.button-row button{
    margin:0;
}

.editor-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.editor-topbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.gear-btn{
    width:38px;
    height:38px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    line-height:1;
    border-radius:10px;
}

.skill-viewer-panel{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.skill-variant-badge{
    position:relative;
    overflow:visible;
}

.skill-variant-badge.active {
    border-color: rgba(196, 216, 255, 0.9);
    box-shadow: inset 0 0 0 1px rgba(196, 216, 255, 0.55), 0 0 0 2px rgba(196, 216, 255, 0.18);
    background: linear-gradient(180deg, rgba(126, 150, 195, 0.35), rgba(74, 90, 122, 0.28));
}

.skill-variant-badge.default::after {
    content:"";
    position:absolute;
    top:1px;
    right:1px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffd76a;
    box-shadow:0 0 0 2px rgba(24, 19, 33, 0.9);
}

.skill-viewer-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
}

.skill-viewer-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.skill-viewer-meta{
    display:flex;
    flex-direction:column;
    gap:4px;
    color:rgba(255,255,255,0.72);
    font-size:13px;
}

.skill-viewer-theme-switch{
    display:flex;
    align-items:center;
    gap:6px;
}

.skill-theme-option{
    width:32px;
    height:32px;
    padding:0;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(118, 93, 158, 0.4);
    color:#f0e8ff;
    font-size:18px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin:0;
}

.skill-theme-option.active{
    background:rgba(128, 96, 176, 0.8);
    border-color:rgba(200, 175, 255, 0.8);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07);
}

.character-editor-theme-switch{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
}

.skill-viewer-text-shell{
    position:relative;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:10px;
    overflow:hidden;
    background:#20172b;
    transition:background 0.2s ease, border-color 0.2s ease;
}

#charEditor .skill-viewer-textarea{
    width:100%;
    min-height:820px;
    height:820px;
    font-family:Consolas, "Courier New", monospace;
    font-size:12px;
    font-weight:400;
    line-height:1.4;
    letter-spacing:0;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    tab-size:4;
}

#charEditor .skill-viewer-textarea{
    display:block;
    resize:vertical;
    padding:12px;
    border:0;
    border-radius:0;
    background:#20172b;
    color:#f1ecff;
    caret-color:#f1ecff;
    margin:0;
}

.skill-viewer-panel[data-skill-theme="light"] .skill-viewer-text-shell{
    border-color:#dfe6ff;
    background:#fff;
}

#charEditor .skill-viewer-panel[data-skill-theme="light"] .skill-viewer-textarea{
    background:#fff;
    color:#1d2330;
    caret-color:#1d2330;
}

.skill-viewer-status{
    font-size:12px;
    color:#cdbdf0;
    opacity:0.9;
}

.skill-viewer-status.dirty{
    color:#ffcf72;
}

#charEditor input,
#charEditor textarea,
#charEditor select,
#effectEditor input,
#effectEditor textarea,
#effectEditor select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2f1f3f;
    color:white;
    margin-bottom:10px;
}

#charEditor input[type="checkbox"],
#effectEditor input[type="checkbox"]{
    width:auto;
    margin:0;
}

.check-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    margin-bottom:10px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:6px;
    opacity:0.8;
}

#charEditor textarea,
#effectEditor textarea{
    min-height:165px;
    resize:vertical;
}

#effectEditor .button-row {
    margin: 14px 0 18px;
}

#effectEditor .button-row button {
    margin: 0;
}

hr{
    border:none;
    height:1px;
    background:#53396d;
    margin:20px 0;
}

.empty{
    opacity:0.6;
}

.node{
    margin-left:10px;
    margin-top:4px;
}

.node-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:0.15s;
    user-select:none;
}

.node-header:hover{
    background:#342046;
}

.selected{
    background:#51306f !important;
}

.children{
    margin-left:16px;
    border-left:1px solid #53396d;
    padding-left:8px;
}

.drop-line{
    height:6px;
    margin:2px 0;
    border-radius:20px;
    transition:0.15s;
}

.drop-line.active{
    background:#9b6dff;
}

.dragging{
    opacity:0.4;
}

.drag-over{
    background:#6b43a5 !important;
}

.drag-over-zone{
    background:rgba(120,80,180,0.2);
    border-radius:8px;
}

.effect-item{
    background:#2d1d3c;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    cursor:pointer;
    transition:0.15s;
}

.effect-item:hover{
    background:#3c2650;
}

.effect-item.selected{
    background:#5b3690;
}

.effect-name{
    font-weight:bold;
    margin-bottom:4px;
}

.effect-type{
    font-size:12px;
    opacity:0.7;
}

.preview{
    margin-top:20px;
    padding:16px;
    border-radius:12px;
    background:#2b1b3a;
}

.preview-title{
    font-weight:bold;
    margin-bottom:8px;
}

.effect-tooltip-preview{
    font-family: Arial, Helvetica, sans-serif;
    text-align: justify;
    background-color: #1e1e2f;
    border-radius: 5px;
    border: 2px solid rgba(90, 90, 90, 0.2);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    color: #fff;
    padding: 8px 12px;
    font-size: 14px;
    max-width: 450px;
    word-break: break-word;
}

.effect-tooltip-preview-title{
    color:#5da2ff;
    font-weight:bold;
    margin-bottom:8px;
}

.effect-tooltip-preview-body{
    white-space:normal;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:12px;
}

.badge.positive{
    background:#2f7d44;
}

.badge.negative{
    background:#8b2f2f;
}

.badge.alert{
    background:#d7d713;
    color:#1b1224;
}

.badge.neutral{
    background:#6b6b6b;
}

.badge.condition{
    background:#2f7d44;
}

.badge.panic_type{
    background:#ff69b4;
    color:#1b1224;
}

.effects-group{
    margin-bottom:18px;
}

.effects-group-header{
    font-weight:bold;
    padding:8px 10px;
    color:#dcd6e8;
}

.effects-group-list{
    padding:8px 10px 16px 10px;
    border-top:1px solid rgba(255,255,255,0.02);
}

.filter-bar{
    display:flex;
    gap:8px;
    margin:10px 0 0 0;
    flex-wrap:wrap;
    align-items:center;
}

.filter-btn{
    background:#342046;
    color:white;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    border:none;
    flex:0 0 auto;
    white-space:nowrap;
}

.filter-btn.active{
    background:#6e43a7;
}

.image-preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:12px;
    margin-top:16px;
}

.image-preview-card{
    background:#2b1b3a;
    border:1px solid #4f3570;
    border-radius:12px;
    padding:10px;
}

.image-preview-card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#d2c6e6;
}

.image-preview-card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    background:#1e1328;
    border:1px solid rgba(255,255,255,0.08);
}

.image-preview-empty{
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#1e1328;
    border:1px dashed rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.55);
    font-size:13px;
}

.image-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
}

.image-management-grid{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    gap:14px;
    align-items:stretch;
    margin-top:14px;
}

.extra-images-section{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:16px;
}

.extra-images-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px;
}

.extra-image-item{
    background:#2b1b3a;
    border:1px solid #4f3570;
    border-radius:12px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.extra-image-item-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:#e9ddff;
    word-break:break-word;
}

.extra-image-item-preview{
    height:150px;
    border-radius:10px;
    overflow:hidden;
    background:#1e1328;
    border:1px solid rgba(255,255,255,0.08);
}

.extra-image-item-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.extra-images-empty{
    color:rgba(255,255,255,0.55);
    font-size:13px;
    padding:6px 0 2px;
}

.image-management-divider{
    width:1px;
    background:#53396d;
    align-self:stretch;
}

.image-management-column{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.image-management-column .button-row{
    margin:0;
}

.image-management-column .image-preview-card{
    min-height:220px;
}

@media (max-width: 820px){
    .image-management-grid{
        grid-template-columns:1fr;
    }

    .image-management-divider{
        display:none;
    }
}

</style>
</head>
<body>

<div class="top-nav">

    <div class="nav-brand">

        <div class="nav-brand-title module-title" onclick="clearAllModuleSelections()">
            JSON Studio
        </div>

        <div class="nav-brand-subtitle">
            Editor de dados local
        </div>

    </div>

    <div class="nav-actions">

        <button
            id="btnEffects"
            class="nav-btn active"
            onclick="showModule('effects')"
        >
            ✨ Effects Editor
        </button>

        <button
            id="btnChars"
            class="nav-btn"
            onclick="showModule('chars')"
        >
            👤 Characters Editor
        </button>

    </div>

</div>

<!-- ========================= -->
<!-- CHARACTERS MODULE -->
<!-- ========================= -->

<div id="charsModule" class="module hidden">

    <div class="sidebar">

        <h1 class="module-title" onclick="clearCharacterSelection()">Characters</h1>

        <div class="topbar">

            <button onclick="addCharacter()">
                + Personagem
            </button>

            <button onclick="addGroup()">
                + Grupo
            </button>

        </div>

        <div class="character-editor-theme-switch" aria-label="Tema global do editor de personagens" style="margin: 8px 0 12px; justify-content:flex-start;">
            <button type="button" class="skill-theme-option active" data-character-theme-option="dark" aria-label="Tema escuro global" title="Tema escuro">☾</button>
            <button type="button" class="skill-theme-option" data-character-theme-option="light" aria-label="Tema claro global" title="Tema claro">☀</button>
        </div>

        <div id="tree"></div>

    </div>

    <div class="content">

        <div class="section" id="charEditorPanel">

            <div class="editor-topbar">
                <h2>Editor</h2>

                <div class="editor-topbar-actions">
                    <button
                        id="openCharacterFolder"
                        class="gear-btn hidden"
                        type="button"
                        title="Abrir pasta do personagem"
                        aria-label="Abrir pasta do personagem"
                        onclick="openSelectedCharacterFolder()"
                    >📂</button>
                    <button
                        id="characterViewToggle"
                        class="gear-btn hidden"
                        type="button"
                        title="Alternar para o arquivo .skill"
                        onclick="toggleCharacterEditorView()"
                    >
                        ⚙
                    </button>
                </div>
            </div>

            <div id="charEditor" class="empty"></div>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- EFFECTS MODULE -->
<!-- ========================= -->

<div id="effectsModule" class="module">

    <div class="sidebar">

        <h1 class="module-title" onclick="clearEffectSelection()">Effects</h1>

        <div class="topbar">

            <button onclick="createEffect()">
                + Novo
            </button>

        </div>

        <div class="filter-bar">
            <button class="filter-btn active" id="filter-all" onclick="setEffectsFilter('all')">Todos</button>
            <button class="filter-btn" id="filter-positive" onclick="setEffectsFilter('positive')">Positive</button>
            <button class="filter-btn" id="filter-alert" onclick="setEffectsFilter('alert')">Alert</button>
            <button class="filter-btn" id="filter-neutral" onclick="setEffectsFilter('neutral')">Neutral</button>
            <button class="filter-btn" id="filter-condition" onclick="setEffectsFilter('condition')">Condition</button>
            <button class="filter-btn" id="filter-panic_type" onclick="setEffectsFilter('panic_type')">Panic Type</button>
            <button class="filter-btn" id="filter-negative" onclick="setEffectsFilter('negative')">Negative</button>
        </div>

        <div id="effectsList"></div>

    </div>

    <div class="content">

        <div class="section" id="effectEditorPanel">

            <h2>Editor</h2>

            <div id="effectEditor" class="empty"></div>

        </div>

    </div>

</div>

<input type="file" id="characterImageInput" accept="image/*" class="hidden">
<input type="file" id="characterExtraImagesInput" accept="image/*" multiple class="hidden">

<script>

// =========================
// MODULE NAVIGATION
// =========================

let activeModule = sessionStorage.getItem("jsonStudio.activeModule") || "effects";

function showModule(module){

    activeModule = module;

    try {
        sessionStorage.setItem("jsonStudio.activeModule", module);
    } catch (err) {
        // ignore storage failures
    }

    document
        .getElementById("charsModule")
        .classList.add("hidden");

    document
        .getElementById("effectsModule")
        .classList.add("hidden");

    document
        .getElementById("btnChars")
        .classList.remove("active");

    document
        .getElementById("btnEffects")
        .classList.remove("active");

    if(module === "chars"){

        document
            .getElementById("charsModule")
            .classList.remove("hidden");

        document
            .getElementById("btnChars")
            .classList.add("active");

        renderCharEditor();

    }else{

        document
            .getElementById("effectsModule")
            .classList.remove("hidden");

        document
            .getElementById("btnEffects")
            .classList.add("active");

        renderEffectEditor();
    }
}

function clearCharacterSelection(){

    selectedNode = null;
    selectedParent = null;
    selectedIndex = null;
    pendingNode = null;
    pendingParent = null;
    pendingIndex = null;
    characterEditorView = "editor";

    try {
        sessionStorage.setItem("jsonStudio.characterEditorView", characterEditorView);
    } catch (err) {
        // ignore storage failures
    }

    renderTree();
    renderCharEditor();
}

function clearEffectSelection(){

    selectedEffectKey = null;
    renderEffectsList();
    renderEffectEditor();
}

function clearAllModuleSelections(){

    clearCharacterSelection();
    clearEffectSelection();
}

function setPanelVisibility(panelId, isVisible){

    const panel = document.getElementById(panelId);
    if(!panel) return;

    if(isVisible){
        panel.classList.remove("hidden");
    }else{
        panel.classList.add("hidden");
    }
}

// =====================================================
// CHARACTERS EDITOR
// =====================================================

let charsData = [];
let charsSaveQueue = Promise.resolve();

let selectedNode = null;
let selectedParent = null;
let selectedIndex = null;
let characterImageUploadContext = null;
let characterEditorView = sessionStorage.getItem("jsonStudio.characterEditorView") || "editor";
let characterPreviewRenderToken = 0;
let characterSkillRenderToken = 0;
let characterExtraImagesRenderToken = 0;
let characterSkillOriginalContent = "";
let characterSkillIsDirty = false;
const characterSkillScrollPositions = new Map();
let characterEditorTheme = sessionStorage.getItem("jsonStudio.characterEditorTheme") || "dark";

// pending (rascunho) quando o usuário cria um novo item mas ainda não confirmou
let pendingNode = null;
let pendingParent = null; // array onde será inserido
let pendingIndex = null;

let draggedItem = null;

const EDITOR_API_PATHS = {
    chars: "api/data/chars",
    effects: "api/data/effects"
};

function resolveEditorApiUrl(path) {
    return new URL(path, window.location.href).href;
}

function verifyImageExists(src) {

    return new Promise(resolve => {

        if (!src) {
            resolve(false);
            return;
        }

        const image = new Image();
        const separator = String(src).includes("?") ? "&" : "?";

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);
        image.src = `${src}${separator}v=${Date.now()}-${Math.random().toString(36).slice(2)}`;
    });
}

async function readEditorJson(path) {
    const response = await fetch(resolveEditorApiUrl(path), {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(`Falha ao ler ${path}: ${response.status}`);
    }

    return response.json();
}

async function writeEditorJson(path, data) {
    const response = await fetch(resolveEditorApiUrl(path), {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data, null, 2)
    });

    if (!response.ok) {
        const message = await response.text().catch(() => "");
        throw new Error(message || `Falha ao salvar ${path}: ${response.status}`);
    }

    return true;
}

async function loadChars(){

    try{

        charsData = await readEditorJson(EDITOR_API_PATHS.chars);

        // if any node has `default: true`, select it on load
        (function findAndSelectDefault(){
            function recurse(arr, parentArr){
                if(!Array.isArray(arr)) return false;
                for(let i = 0; i < arr.length; i++){
                    const item = arr[i];
                    if(item && item.default){
                        selectedNode = item;
                        selectedParent = parentArr;
                        selectedIndex = i;
                        if(item.type !== "group"){
                            characterEditorView = "editor";
                            try {
                                sessionStorage.setItem("jsonStudio.characterEditorView", characterEditorView);
                            } catch (err) {
                                // ignore storage failures
                            }
                        }
                        return true;
                    }
                    if(item && item.type === 'group' && Array.isArray(item.children)){
                        if(recurse(item.children, item.children)) return true;
                    }
                }
                return false;
            }

            // try to find in top-level array
            recurse(charsData, charsData);
        })();

        renderTree();

        // if we selected a node, render its editor
        if(selectedNode) renderCharEditor();

    }catch(err){

        alert("Erro ao carregar chars.json");

        console.error(err);
    }
}

function renderTree(){

    const tree =
        document.getElementById("tree");

    tree.innerHTML = "";

    // ==================================================
    // Os listeners da raiz NÃO devem ser adicionados
    // novamente a cada renderização.
    //
    // Usamos uma flag para instalar apenas uma vez.
    // ==================================================

    if(!tree.dataset.dragHandlersInstalled){

        tree.addEventListener("dragover", (e) => {

            e.preventDefault();

            tree.classList.add("drag-over-zone");
        });

        tree.addEventListener("dragleave", () => {

            tree.classList.remove("drag-over-zone");
        });

        tree.addEventListener("drop", async (e) => {

            e.preventDefault();

            tree.classList.remove(
                "drag-over-zone"
            );

            if(!draggedItem){
                return;
            }

            await moveDraggedNode(
                charsData,
                charsData.length
            );
        });

        tree.dataset.dragHandlersInstalled = "true";
    }

    // ==================================================
    // Renderiza a árvore
    // ==================================================

    charsData.forEach((item, index) => {

        tree.appendChild(
            createNode(
                item,
                charsData,
                index
            )
        );
    });
}

function createNode(node, parentArray, index){

    const wrapper =
        document.createElement("div");

    const dropBefore =
        document.createElement("div");

    dropBefore.className = "drop-line";

    const dropAfter =
        document.createElement("div");

    dropAfter.className = "drop-line";

    dropBefore.addEventListener("dragover", (e) => {

        e.preventDefault();

        dropBefore.classList.add("active");
    });

    dropBefore.addEventListener("dragleave", () => {

        dropBefore.classList.remove("active");
    });

    dropBefore.addEventListener("drop", async (e) => {

        e.preventDefault();

        dropBefore.classList.remove("active");

        if(
            draggedItem &&
            draggedItem.node.type === "group" &&
            isNodeInSubtree(draggedItem.node, node)
        ) return;

        await moveDraggedNode(parentArray, index);
    });

    wrapper.appendChild(dropBefore);

    const container =
        document.createElement("div");

    container.className = "node";

    const header =
        document.createElement("div");

    header.className = "node-header";

    header.draggable = true;

    if(selectedNode === node){
        header.classList.add("selected");
    }

    header.addEventListener("dragstart", () => {

        draggedItem = {
            node,
            parentArray,
            index
        };

        header.classList.add("dragging");
    });

    header.addEventListener("dragend", () => {

        document
            .querySelectorAll(".active")
            .forEach(el => {
                el.classList.remove("active");
            });

        header.classList.remove("dragging");
    });

    const icon =
        document.createElement("span");

    if(node.type === "group"){

        icon.textContent =
            node.open ? "📂" : "📁";

    }else{

        icon.textContent = "👤";
    }

    const label =
        document.createElement("span");

    label.textContent =
        node.label || "Sem nome";

    header.appendChild(icon);
    header.appendChild(label);

    header.onclick = () => {

        selectedNode = node;
        selectedParent = parentArray;
        selectedIndex = index;

        if(node.type !== "group"){
            characterEditorView = "editor";

            try {
                sessionStorage.setItem("jsonStudio.characterEditorView", characterEditorView);
            } catch (err) {
                // ignore storage failures
            }
        }

        if(node.type === "group"){
            node.open = !node.open;
        }

        renderTree();
        renderCharEditor();
    };

    header.addEventListener("dragover", (e) => {

        e.preventDefault();

        header.classList.add("drag-over");
    });

    header.addEventListener("dragleave", () => {

        header.classList.remove("drag-over");
    });

    header.addEventListener("drop", async (e) => {
    e.stopPropagation();
    e.preventDefault();
    header.classList.remove("drag-over");

    if (!draggedItem) return;

    // Impede que um item seja solto em cima dele mesmo.
    if (draggedItem.node === node) {
        draggedItem = null;
        return;
    }

    // Um grupo nunca pode ser colocado dentro de si mesmo
    // ou dentro de qualquer descendente dele.
    if (
        draggedItem.node.type === "group" &&
        isNodeInSubtree(draggedItem.node, node)
    ) {
        draggedItem = null;
        return;
    }

    if (node.type === "group") {
        // Soltar sobre uma pasta significa mover para dentro dela.
        node.children = node.children || [];
        const moved = await moveDraggedNode(node.children, node.children.length);

        if (moved) {
            node.open = true;
            renderTree();
        }
    } else {
        // Soltar sobre outro personagem insere logo depois dele.
        await moveDraggedNode(parentArray, index + 1);
    }
    });

    dropAfter.addEventListener("dragover", (e) => {

        e.preventDefault();

        dropAfter.classList.add("active");
    });

    dropAfter.addEventListener("dragleave", () => {

        dropAfter.classList.remove("active");
    });

    dropAfter.addEventListener("drop", async (e) => {

        e.preventDefault();

        dropAfter.classList.remove("active");

        if(
            draggedItem &&
            draggedItem.node.type === "group" &&
            isNodeInSubtree(draggedItem.node, node)
        ) return;

        await moveDraggedNode(parentArray, index + 1);
    });

    container.appendChild(header);

    if(node.type === "group" && node.open){

        const children =
            document.createElement("div");

        children.className = "children";

        node.children ||= [];

        node.children.forEach((child, i) => {

            children.appendChild(
                createNode(child, node.children, i)
            );
        });

        container.appendChild(children);
    }

    wrapper.appendChild(container);
    wrapper.appendChild(dropAfter);

    return wrapper;
}

function getArrayFolderPath(targetArray){

    if(targetArray === charsData){
        return "";
    }

    function walk(nodes, trail){

        if(!Array.isArray(nodes)) return null;

        if(nodes === targetArray){
            return trail.join("/");
        }

        for(const item of nodes){

            if(
                item &&
                item.type === "group" &&
                Array.isArray(item.children)
            ){
                const groupPath = trail.concat(
                    buildGroupFolderName(
                        item.folder || item.label
                    )
                );

                const result = walk(
                    item.children,
                    groupPath
                );

                if(result !== null){
                    return result;
                }
            }
        }

        return null;
    }

    return walk(charsData, []) || "";
}

function getDraggedDestinationFolderPath(node, targetArray){

    const parentPath = getArrayFolderPath(targetArray);

    const nodeFolderName = node.type === "group"
        ? buildGroupFolderName(
            node.folder || node.label
        )
        : buildCharacterFolderName(
            node.label
        );

    return parentPath
        ? `${parentPath}/${nodeFolderName}`
        : nodeFolderName;
}

function findNodeLocation(targetNode){

    function walk(nodes){

        if(!Array.isArray(nodes)) return null;

        for(let i = 0; i < nodes.length; i++){

            const item = nodes[i];

            if(item === targetNode){
                return {
                    parentArray: nodes,
                    index: i
                };
            }

            if(
                item &&
                item.type === "group" &&
                Array.isArray(item.children)
            ){
                const result = walk(item.children);

                if(result){
                    return result;
                }
            }
        }

        return null;
    }

    return walk(charsData);
}

const MAX_CHARACTER_FOLDER_DEPTH = 3;

function getCharacterFolderDepth(targetArray){
    const folderPath = getArrayFolderPath(targetArray);
    return folderPath
        ? folderPath.split("/").filter(Boolean).length
        : 0;
}

function getGroupSubtreeDepth(node){
    if(!node || node.type !== "group") return 0;

    const children = Array.isArray(node.children) ? node.children : [];
    const deepestChildGroup = children.reduce(
        (deepest, child) => Math.max(deepest, getGroupSubtreeDepth(child)),
        0
    );

    return 1 + deepestChildGroup;
}

function canPlaceCharacterNodeIn(targetArray, node){
    const targetDepth = getCharacterFolderDepth(targetArray);

    return node?.type === "group"
        ? targetDepth + getGroupSubtreeDepth(node) <= MAX_CHARACTER_FOLDER_DEPTH
        : targetDepth <= MAX_CHARACTER_FOLDER_DEPTH;
}

let movingDraggedNode = false;

async function moveDraggedNode(
    targetArray,
    targetIndex
){

    // ==================================================
    // IMPEDE DUPLA EXECUÇÃO
    // ==================================================

    if(movingDraggedNode){
        return false;
    }

    if(!draggedItem){
        return false;
    }

    movingDraggedNode = true;

    try{

        const {
            parentArray: sourceArray,
            index: sourceIndex,
            node: draggedNode
        } = draggedItem;

        if(!canPlaceCharacterNodeIn(targetArray, draggedNode)){
            alert(`A árvore de personagens permite no máximo ${MAX_CHARACTER_FOLDER_DEPTH} níveis de pastas.`);
            return false;
        }

        // ==================================================
        // NÃO PERMITIR GRUPO DENTRO DE SI MESMO
        // ==================================================

        if(
            draggedNode.type === "group" &&
            targetArray === draggedNode.children
        ){

            draggedItem = null;

            return false;
        }

        // ==================================================
        // REORDENAÇÃO DENTRO DO MESMO PAI
        // ==================================================

        if(sourceArray === targetArray){

            if(
                sourceIndex === targetIndex ||
                sourceIndex === targetIndex - 1
            ){

                draggedItem = null;

                return false;
            }

            sourceArray.splice(
                sourceIndex,
                1
            );

            let finalIndex = targetIndex;

            if(sourceIndex < targetIndex){
                finalIndex--;
            }

            targetArray.splice(
                finalIndex,
                0,
                draggedNode
            );

            const location =
                findNodeLocation(
                    draggedNode
                );

            if(location){

                selectedNode =
                    draggedNode;

                selectedParent =
                    location.parentArray;

                selectedIndex =
                    location.index;
            }

            draggedItem = null;

            renderTree();

            renderCharEditor();

            await saveChars();

            return true;
        }

        // ==================================================
        // MOVIMENTO ENTRE PAIS
        // ==================================================

        const sourceFolderPath =
            getNodeFolderPath(
                draggedNode
            );

        const destinationFolderPath =
            getDraggedDestinationFolderPath(
                draggedNode,
                targetArray
            );

        // ==================================================
        // MOVER A PASTA FÍSICA PRIMEIRO
        // ==================================================

        if(
            sourceFolderPath &&
            destinationFolderPath &&
            sourceFolderPath !== destinationFolderPath
        ){

            try{

                const response =
                    await fetch(
                        resolveEditorApiUrl(
                            "api/chars/rename"
                        ),
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                oldFolderPath:
                                    sourceFolderPath,

                                newFolderPath:
                                    destinationFolderPath,

                                oldFileName:
                                    draggedNode.type === "group"
                                        ? ""
                                        : String(
                                            draggedNode.target ||
                                            buildCharacterTarget(
                                                draggedNode.label
                                            )
                                        ).trim(),

                                newFileName:
                                    draggedNode.type === "group"
                                        ? ""
                                        : buildCharacterTarget(
                                            draggedNode.label
                                        ),

                                type:
                                    draggedNode.type
                            })
                        }
                    );

                if(!response.ok){

                    const message =
                        await response
                            .text()
                            .catch(() => "");

                    throw new Error(
                        message ||
                        "Falha ao mover a pasta."
                    );
                }

            }catch(error){

                console.error(
                    "Erro ao mover pasta:",
                    error
                );

                alert(
                    error &&
                    error.message
                        ? error.message
                        : "Não foi possível mover o personagem."
                );

                draggedItem = null;

                return false;
            }
        }

        // ==================================================
        // SOMENTE DEPOIS DO MOVE FÍSICO:
        // altera charsData
        // ==================================================

        sourceArray.splice(
            sourceIndex,
            1
        );

        const finalIndex =
            Math.min(
                Math.max(
                    targetIndex,
                    0
                ),
                targetArray.length
            );

        targetArray.splice(
            finalIndex,
            0,
            draggedNode
        );

        const location =
            findNodeLocation(
                draggedNode
            );

        if(location){

            selectedNode =
                draggedNode;

            selectedParent =
                location.parentArray;

            selectedIndex =
                location.index;
        }

        // ==================================================
        // LIMPA O DRAG UMA ÚNICA VEZ
        // ==================================================

        draggedItem = null;

        // ==================================================
        // ATUALIZA A INTERFACE
        // ==================================================

        renderTree();

        renderCharEditor();

        // ==================================================
        // SALVA SOMENTE DEPOIS DO MOVE
        // ==================================================

        await saveChars();

        return true;

    } finally {

        // Mesmo se ocorrer qualquer erro inesperado,
        // libera o bloqueio para o próximo drag.
        movingDraggedNode = false;
    }
}

function isNodeInSubtree(root, candidate){

    if(root === candidate) return true;

    if(
        root &&
        root.type === "group" &&
        Array.isArray(root.children)
    ){
        return root.children.some(child =>
            isNodeInSubtree(child, candidate)
        );
    }

    return false;
}

function updateCharacterViewToggle(isVisible){

    const openFolderButton = document.getElementById("openCharacterFolder");

        button.classList.add("hidden");
        button.title = "";

    button.classList.remove("hidden");

        ? "Voltar para a edição"
        : "Alternar para o arquivo .skill";
}

async function openSelectedCharacterFolder(){
    if(!selectedNode || selectedNode.type === "group" || selectedNode === pendingNode) return;

    const folderPath = getCharacterFolderPath(selectedNode);
    if(!folderPath) return;

    try{
        const response = await fetch(resolveEditorApiUrl("api/chars/open-folder"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folderPath })
        });
        const responseBody = await response.text();
        let result = {};
        try{
            result = responseBody ? JSON.parse(responseBody) : {};
        }catch(error){
            result = { error: responseBody };
        }

        if(!response.ok){
            throw new Error(result.error || "Não foi possível abrir a pasta do personagem.");
        }
    }catch(error){
        alert(error.message || "Não foi possível abrir a pasta do personagem.");
    }
}

function getCharacterSkillDefaultTarget(node){
    if(!node || node.type === "group") return "";

    const explicit = String(node.defaultTarget || "").trim();
    if(explicit) return explicit;

    return String(node.target || buildCharacterTarget(node.label || "")).trim();
}

function getSelectedCharacterSkillUrl(node){

    const folderPath = getCharacterFolderPath(node);
    if(!folderPath) return "";

    const fileName = String(node.target || getCharacterSkillDefaultTarget(node) || buildCharacterTarget(node.label || "")).trim();
    if(!fileName) return "";

    return encodeURI(`bd/chars/${folderPath}/${fileName}`);
}

function getCharacterSkillBaseName(rawTarget){
    const normalized = String(rawTarget || "").trim();
    const match = normalized.match(/^(.+?)(?:\((\d+)\))?\.skill$/i);
    if(!match) return normalized.replace(/\.skill$/i, "");
    return match[1].trim();
}

async function getCharacterSkillVariantCandidates(node){
    if(!node || node.type === "group") return [];

    const folderPath = getCharacterFolderPath(node);
    if(!folderPath) return [];

    const rawTarget = String(node.target || buildCharacterTarget(node.label || "")).trim();
    const baseFileName = getCharacterSkillBaseName(rawTarget);
    const candidates = [
        `${baseFileName}.skill`,
        `${baseFileName}(2).skill`,
        `${baseFileName}(3).skill`,
        `${baseFileName}(4).skill`,
        `${baseFileName}(5).skill`
    ];
    const variants = [];
    const seen = new Set();

    for(const candidate of candidates){
        const url = encodeURI(`bd/chars/${folderPath}/${candidate}`);
        if(seen.has(candidate)) continue;
        seen.add(candidate);

        try{
            const response = await fetch(resolveEditorApiUrl(url), { method: "HEAD", cache: "no-store" });
            if(!response.ok) {
                const fallback = await fetch(resolveEditorApiUrl(url), { cache: "no-store" });
                if(!fallback.ok) continue;
            }
            variants.push(candidate);
        }catch(err){
            // ignore missing variants
        }
    }

    return variants.length ? variants : [rawTarget];
}

async function createCharacterSkillVariant(node, variantIndex){
    if(!node || node.type === "group" || node === pendingNode) return "";

    const folderPath = getCharacterFolderPath(node);
    if(!folderPath) return "";

    const rawTarget = String(node.target || buildCharacterTarget(node.label || "")).trim();
    const baseFileName = getCharacterSkillBaseName(rawTarget);
    const fileName = variantIndex <= 1
        ? `${baseFileName}.skill`
        : `${baseFileName}(${variantIndex}).skill`;
    const params = new URLSearchParams({
        folderPath,
        fileName
    });

    const response = await fetch(resolveEditorApiUrl(`api/chars/skill?${params.toString()}`), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: "" })
    });

    if(response.ok) return fileName;

    return "";
}

async function deleteCharacterSkillVariant(node, fileName){
    if(!node || node.type === "group" || node === pendingNode || !fileName) return;

    const folderPath = getCharacterFolderPath(node);
    if(!folderPath) return;

    const isBaseVariant = !/\(\d+\)\.skill$/i.test(fileName);
    const title = isBaseVariant
        ? `Limpar a versão ${fileName}?`
        : `Deseja excluir a versão ${fileName}?`;
    const message = isBaseVariant
        ? `Você vai limpar o conteúdo de ${fileName}. O arquivo continuará existindo, mas ficará vazio.`
        : `Você está removendo o arquivo ${fileName}. Essa ação não pode ser desfeita.`;

    showVariantModal({
        title: isBaseVariant ? "Limpar versão" : "Excluir versão",
        message,
        confirmLabel: isBaseVariant ? "Limpar" : "OK",
        cancelLabel: "Cancelar",
        kind: isBaseVariant ? "info" : "danger",
        onConfirm: async () => {
            const params = new URLSearchParams({ folderPath, fileName });
            const response = await fetch(resolveEditorApiUrl(`api/chars/skill?${params.toString()}`), {
                method: isBaseVariant ? "PUT" : "DELETE",
                headers: isBaseVariant ? { "Content-Type": "application/json" } : undefined,
                body: isBaseVariant ? JSON.stringify({ content: "" }) : undefined
            });

            if(!response.ok){
                const payload = await response.json().catch(() => null);
                showVariantModal({
                    title: isBaseVariant ? "Falha ao limpar" : "Falha ao excluir",
                    message: payload?.error || (isBaseVariant ? "Falha ao limpar a versão." : "Falha ao excluir a versão."),
                    confirmLabel: "OK",
                    cancelLabel: "",
                    kind: "danger"
                });
                return;
            }

            if(isBaseVariant){
                selectedNode.target = fileName;
                renderCharacterSkillView();
                return;
            }

            const remaining = await getCharacterSkillVariantCandidates(node);
            const nextTarget = remaining.find(candidate => candidate.toLowerCase() !== fileName.toLowerCase()) || "";

            if(nextTarget){
                selectedNode.target = nextTarget;
            } else {
                const baseName = getCharacterSkillBaseName(fileName);
                selectedNode.target = `${baseName}.skill`;
            }

            renderCharacterSkillView();
        }
    });
}

async function syncCharacterSkillVariantBadge(){
    const badgeWrap = document.getElementById("skillVariantBadgeRow");
    if(!badgeWrap || !selectedNode || selectedNode.type === "group" || selectedNode === pendingNode) {
        if(badgeWrap) badgeWrap.innerHTML = "";
        return;
    }

    const variants = await getCharacterSkillVariantCandidates(selectedNode);
    const selectedTarget = String(selectedNode.target || buildCharacterTarget(selectedNode.label || "")).trim();
    const defaultTarget = getCharacterSkillDefaultTarget(selectedNode);
    const currentTarget = String(selectedNode.target || defaultTarget || "").trim();
    const activeBaseName = getCharacterSkillBaseName(selectedTarget || defaultTarget);

    badgeWrap.innerHTML = "";

    for(let variantNumber = 1; variantNumber <= 5; variantNumber += 1){
        const candidate = variantNumber === 1
            ? `${activeBaseName}.skill`
            : `${activeBaseName}(${variantNumber}).skill`;
        const exists = variants.some(item => item.toLowerCase() === candidate.toLowerCase());
        const isDefaultVariant = exists && candidate.toLowerCase() === defaultTarget.toLowerCase();
        const isSelectedVariant = exists && candidate.toLowerCase() === selectedTarget.toLowerCase();

    defaultButton.style.cursor = "pointer";
    defaultButton.disabled = !currentTarget;
    defaultButton.addEventListener("click", () => {
        const fileName = String(selectedNode.target || defaultTarget || "").trim();
        if(!fileName) return;

async function loadCharacterSkillContent(textarea, skillUrl, renderToken){

    if(!textarea) return;

    try{
        const response = await fetch(resolveEditorApiUrl(skillUrl), {
            cache: "no-store"
        });

        if(renderToken !== characterSkillRenderToken) return;

        if(!response.ok){
            textarea.value = "Arquivo .skill não encontrado.";
            return;
        }

        const content = await response.text();

        if(renderToken !== characterSkillRenderToken) return;

        characterSkillOriginalContent = content || "";
        characterSkillIsDirty = false;
        textarea.value = characterSkillOriginalContent;
        textarea.scrollTop = characterSkillScrollPositions.get(textarea.dataset.skillScrollKey) || 0;
        updateCharacterSkillDirtyIndicator();
    }catch(err){
        if(renderToken !== characterSkillRenderToken) return;

        characterSkillOriginalContent = "";
        characterSkillIsDirty = false;
        textarea.value = "Falha ao carregar o arquivo .skill.";
        updateCharacterSkillDirtyIndicator();
    }
}

function getCharacterFolderPath(node){

    if(!node || node.type === "group") return "";

    const parts = [];

    function walk(nodes, trail){

        if(!Array.isArray(nodes)) return false;

        for(const item of nodes){
            if(!item || typeof item !== "object") continue;

            if(item.type === "group"){
                const folderName = buildGroupFolderName(item.label);
                if(walk(item.children, trail.concat(folderName))) return true;
                continue;
            }

            if(item === node){
                parts.push(...trail, buildCharacterFolderName(item.label));
                return true;
            }
        }

        return false;
    }

    walk(charsData, []);
    return parts.join("/");
}

async function loadCharacterExtraImages(folderPath, renderToken){

    const list = document.getElementById("extraImagesList");
    if(!list) return;

    try{
        const response = await fetch(resolveEditorApiUrl("api/chars/image"), {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "list",
                folderPath
            })
        });

        if(renderToken !== characterExtraImagesRenderToken) return;

        if(!response.ok){
            list.innerHTML = `<div class="extra-images-empty">Falha ao carregar as imagens extras.</div>`;
            return;
        }

        const data = await response.json();

        if(renderToken !== characterExtraImagesRenderToken) return;

        const images = Array.isArray(data.images) ? data.images : [];

        if(!images.length){
            list.innerHTML = `<div class="extra-images-empty">Nenhuma imagem extra na pasta do personagem.</div>`;
            return;
        }

        list.innerHTML = images.map(fileName => `
            <div class="extra-image-item">
                <div class="extra-image-item-title">
                    <strong>${fileName}</strong>
                    <button class="danger" type="button" onclick="removeCharacterExtraImage('${fileName.replace(/'/g, "\\'")}')">

                    </button>
                </div>

                <div class="extra-image-item-preview">
                    <img src="${encodeURI(`bd/chars/${folderPath}/${fileName}`)}?v=${Date.now()}" alt="${fileName}">
                </div>
            </div>
        `).join("");
    }catch(err){
        if(renderToken !== characterExtraImagesRenderToken) return;

        list.innerHTML = `<div class="extra-images-empty">Falha ao carregar as imagens extras.</div>`;
    }
}

async function uploadCharacterExtraImages(files){

    for(const file of files){
        const dataUrl = await readFileAsDataUrl(file);

                mimeType: file.type || "",
                data: base64
            })
        });

            const message = await response.text().catch(() => "");
            throw new Error(message || "Falha ao adicionar imagem à pasta.");

async function loadCharacterImagePreview(previewRoot, folderPath, kind, renderToken){

    const card = previewRoot.querySelector(`.image-preview-card[data-kind="${kind}"]`);
    const status = previewRoot.querySelector(`#preview-status-${kind}`);
    if(!card || !status) return;

    card.innerHTML = `
        <div class="image-preview-card-title">
            <span>${kind === "showcase" ? "Showcase" : "Combat"}</span>
            <span id="preview-status-${kind}">Sem imagem</span>
        </div>
        <div class="image-preview-empty">Sem imagem</div>
    `;

    const candidates = ["png", "jpg", "jpeg", "webp", "gif"]
        .map(ext => encodeURI(`bd/chars/${folderPath}/${kind}.${ext}`));

    for(const src of candidates){
        if(renderToken !== characterPreviewRenderToken) return;

        const exists = await verifyImageExists(src);
        if(renderToken !== characterPreviewRenderToken) return;

        if(exists){
            card.innerHTML = `
                <div class="image-preview-card-title">
                    <span>${kind === "showcase" ? "Showcase" : "Combat"}</span>
                    <span id="preview-status-${kind}">Encontrada</span>
                </div>
                <img src="${src}" alt="${kind}">
            `;
            return;
        }
    }

    status.textContent = "Sem imagem";
}

function buildCharacterFolderName(label){

    return normalizeFsSegment(label, "Novo Personagem");
}

function findCharacterImagePath(nodes, targetNode, segments = []){

    if(!Array.isArray(nodes)) return null;

    for(const node of nodes){

        if(!node || typeof node !== "object") continue;

        if(node.type === "group"){

            const groupSegment = buildGroupFolderName(
                node.folder || node.label
            );

            const found = findCharacterImagePath(
                Array.isArray(node.children) ? node.children : [],
                targetNode,
                segments.concat(groupSegment)
            );

            if(found) return found;

            continue;
        }

        if(node === targetNode){
            return segments.concat(buildCharacterFolderName(node.label)).join("/");
        }
    }

    return null;
}

    };

        input.click();
    }
}

function readFileAsDataUrl(file){

    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("Falha ao ler o arquivo"));
        reader.readAsDataURL(file);
    });
}

async function uploadCharacterImage(file){

    if(!characterImageUploadContext) return;

    const { kind, folderPath } = characterImageUploadContext;

    if(!kind || !folderPath) return;

    const dataUrl = await readFileAsDataUrl(file);
    const base64 = String(dataUrl).split(",")[1] || "";

    if(!base64){
        throw new Error("Não foi possível processar a imagem selecionada.");
    }

    const response = await fetch(resolveEditorApiUrl("api/chars/image"), {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            folderPath,
            baseName: kind,
            originalName: file.name || "",
            mimeType: file.type || "",
            data: base64
        })
    });

    if(!response.ok){
        const message = await response.text().catch(() => "");
        throw new Error(message || "Falha ao enviar a imagem.");
    }

    renderCharEditor();

    return response.json().catch(() => ({}));
}

function getNodeFolderPath(node, overrideLabel = null){

    if(!node){
        return "";
    }

    const parts = [];

    function walk(nodes, trail){

        if(!Array.isArray(nodes)){
            return false;
        }

        for(const item of nodes){

            if(!item || typeof item !== "object") continue;

            if(item.type === "group"){

                const groupLabel = item === node
                    ? (
                        overrideLabel !== null
                            ? overrideLabel
                            : item.label
                    )
                    : (item.folder || item.label);

                const groupSegment =
                    buildGroupFolderName(groupLabel);

                if(item === node){
                    parts.push(
                        ...trail,
                        groupSegment
                    );
                    return true;
                }

                if(
                    walk(
                        Array.isArray(item.children)
                            ? item.children
                            : [],
                        trail.concat(groupSegment)
                    )
                ){
                    return true;
                }

                continue;
            }

            if(item === node){

                const characterLabel =
                    overrideLabel !== null
                        ? overrideLabel
                        : item.label;

                parts.push(
                    ...trail,
                    buildCharacterFolderName(
                        characterLabel
                    )
                );

                return true;
            }
        }

        return false;
    }

    walk(charsData, []);

    return parts.join("/");
}

async function applyCharEdit(){

    if(!selectedNode) return;

    try {

    const nextLabelField = document.getElementById("edit-label");
    const nextLabel = nextLabelField ? nextLabelField.value : "";
    const previousLabel = selectedNode.label || "";
    const previousFolderPath = getNodeFolderPath(selectedNode, previousLabel);
    const nextFolderPath = getNodeFolderPath(selectedNode, nextLabel);
    const previousTarget = selectedNode.type === "group"
        ? ""
        : String(selectedNode.target || buildCharacterTarget(previousLabel)).trim();
    const nextTarget = selectedNode.type === "group"
        ? ""
        : buildCharacterTarget(nextLabel);

    if(previousFolderPath && nextFolderPath && previousFolderPath !== nextFolderPath){
        const response = await fetch(resolveEditorApiUrl("api/chars/rename"), {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                oldFolderPath: previousFolderPath,
                newFolderPath: nextFolderPath,
                oldFileName: previousTarget,
                newFileName: nextTarget,
                type: selectedNode.type
            })
        });

        if(!response.ok){
            const message = await response.text().catch(() => "");
            throw new Error(message || "Falha ao renomear a pasta do personagem.");
        }
    }

    selectedNode.label =
        nextLabel;

    const defaultField = document.getElementById(
        "edit-default"
    );

    if (defaultField.checked) {
        clearDefaultFlags(charsData, selectedNode);
        selectedNode.default = true;
    } else {
        delete selectedNode.default;
    }

    if(selectedNode.type === "group"){

        selectedNode.folder = buildGroupFolderName(selectedNode.label);

    }else{

        selectedNode.target = buildCharacterTarget(selectedNode.label);
        const hiddenField = document.getElementById("edit-hidden");
        if(hiddenField && hiddenField.checked){
            selectedNode.hidden = true;
        }else{
            delete selectedNode.hidden;
        }
    }

    renderTree();
    renderCharEditor();
    saveChars();

    }catch(err){

        console.error(err);
        alert(err && err.message ? err.message : "Falha ao aplicar a edição do personagem.");
    }
}

function clearDefaultFlags(nodes, keepNode = null){

    if(!Array.isArray(nodes)) return;

    nodes.forEach(node => {

        if(!node || node === keepNode) return;

        delete node.default;

        if(node.type === "group" && Array.isArray(node.children)){
            clearDefaultFlags(node.children, keepNode);
        }
    });
}

function normalizeFsSegment(value, fallback = ""){

    const normalized = String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    return normalized || fallback;
}

function buildGroupFolderName(label){

    return normalizeFsSegment(label, "Nova Pasta");
}

function buildCharacterTarget(label){

    const base = normalizeFsSegment(label, "novo personagem").toLowerCase();

    return `${base}.skill`;
}

    if(

        selectedIndex === null
    ) return;

        `Excluir item?\n\n"${selectedNode.label}"`

    if(!confirmed) return;

    selectedParent.splice(

        1
    );

    selectedNode = null;
    selectedParent = null;
    selectedIndex = null;

    renderTree();

        "charEditor"

function duplicateSelected(){

    if(
        !selectedParent ||
        selectedIndex === null
    ) return;

    const clone =
        JSON.parse(
            JSON.stringify(selectedNode)
        );

    clone.label =
        clone.label + " (Cópia)";

    if(clone.type === "group"){
        clone.folder = buildGroupFolderName(clone.label);
    }else{

    selectedParent.splice(

    renderTree();
    saveChars();

function stripOpenFlags(node){

    if(!node || typeof node !== "object"){
        return node;
    }

    if(Array.isArray(node)){
        return node.map(stripOpenFlags);
    }

    const cleaned = {};

    Object.keys(node).forEach(key => {

        if(key === "open") return;

        cleaned[key] = stripOpenFlags(node[key]);
    });

    return cleaned;
}

function saveChars(){

    charsSaveQueue =
        charsSaveQueue.then(async () => {

            // Captura o estado somente quando esta gravação
            // chegar à vez na fila. Assim uma gravação antiga

            const sanitizedCharsData =
                stripOpenFlags(charsData);

            await writeEditorJson(
                EDITOR_API_PATHS.chars,
                sanitizedCharsData
            );

        }).catch(error => {

            console.error(
                "Erro ao salvar chars.json:",
                error
            );

            throw error;
        });

    return charsSaveQueue;
}

let effectsData = {};

// Drag state for effects list
let draggedEffectKey = null;
// Current filter for effects list: 'all' | 'positive' | 'alert' | 'neutral' | 'condition' | 'panic_type' | 'negative'
let effectsFilter = sessionStorage.getItem('jsonStudio.effectsFilter') || 'all';

function setEffectsFilter(type){
    effectsFilter = type || 'all';

    // update button active states
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    const id = `filter-${effectsFilter}`;
    const el = document.getElementById(id);
    if(el) el.classList.add('active');

    try{ sessionStorage.setItem('jsonStudio.effectsFilter', effectsFilter); }catch(e){}

    renderEffectsList();
}

function reorderEffects(dragKey, dropKey) {
    if (!dragKey || !dropKey || dragKey === dropKey) return;

    // preserve original data reference
    const original = Object.assign({}, effectsData);

    const keys = Object.keys(original);

    const from = keys.indexOf(dragKey);
    const to = keys.indexOf(dropKey);

    if (from === -1 || to === -1) return;

    // remove dragged
    keys.splice(from, 1);

    // insert before drop target
    keys.splice(to, 0, dragKey);

    const newData = {};
    keys.forEach(k => { newData[k] = original[k]; });

    effectsData = newData;

    // preserve selection if possible
    if (!effectsData[selectedEffectKey]) {
        selectedEffectKey = null;
    }

    renderEffectsList();
    renderEffectEditor();
    saveEffects();
}

let selectedEffectKey = null;

// restore active filter state on init
setEffectsFilter(effectsFilter);

async function loadEffects(){

    try{

        effectsData = await readEditorJson(EDITOR_API_PATHS.effects);

function renderEffectsList(){

    const list = document.getElementById("effectsList");

    list.innerHTML = "";

    const keys = Object.keys(effectsData);

    const allTypes = ["positive", "alert", "neutral", "condition", "panic_type", "negative"];
    const typesOrder = effectsFilter === 'all'
        ? allTypes
        : [effectsFilter];

    typesOrder.forEach(type => {

        const groupKeys = keys.filter(k => (effectsData[k] && effectsData[k].type) === type);

        if (!groupKeys.length) return;

        const section = document.createElement('div');
        section.className = 'effects-group';

        const header = document.createElement('div');
        header.className = 'effects-group-header';
        header.textContent = `${type.charAt(0).toUpperCase() + type.slice(1)} (${groupKeys.length})`;

        const container = document.createElement('div');
        container.className = 'effects-group-list';

        groupKeys.forEach(key => {

            const effect = effectsData[key];

            const item = document.createElement('div');

            item.className = 'effect-item';
            item.draggable = true;
            item.dataset.key = key;

            if (selectedEffectKey === key) item.classList.add('selected');

            // Drag handlers
            item.addEventListener('dragstart', (e) => {
                draggedEffectKey = key;
                item.classList.add('dragging');
                try { e.dataTransfer.setData('text/plain', key); } catch (err) {}
                e.dataTransfer.effectAllowed = 'move';
            });

            item.addEventListener('dragend', () => {
                draggedEffectKey = null;
                item.classList.remove('dragging');
                document.querySelectorAll('.effect-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            });

            item.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                item.classList.add('drag-over');
            });

            item.addEventListener('dragleave', () => {
                item.classList.remove('drag-over');
            });

            item.addEventListener('drop', (e) => {
                e.preventDefault();
                item.classList.remove('drag-over');
                const dropKey = key;
                if (draggedEffectKey && draggedEffectKey !== dropKey) {
                    reorderEffects(draggedEffectKey, dropKey);
                }
            });

            item.onclick = () => {
                selectedEffectKey = key;
                renderEffectsList();
                renderEffectEditor();
            };

            item.innerHTML = `
                <div class="effect-name">${key}</div>
                <div class="effect-type">${effect.type}</div>
            `;

            container.appendChild(item);
        });

        section.appendChild(header);
        section.appendChild(container);
        list.appendChild(section);
    });
}

    function escapeHtml(text){

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}

    function normalizePreviewText(text){

    const rawLines = String(text || "")
        .replace(/\r\n?/g, "\n")
        .split("\n");

    while (rawLines.length && !rawLines[0].trim()) {
        rawLines.shift();
    }

    while (rawLines.length && !rawLines[rawLines.length - 1].trim()) {
        rawLines.pop();
    }

    const indentSizes = rawLines
        .filter(line => line.trim().length)
        .map(line => (line.match(/^\s*/) || [""])[0].length);

    const commonIndent = indentSizes.length
        ? Math.min(...indentSizes)
        : 0;

    return rawLines
        .map(line => line.slice(commonIndent).trim())
        .filter(line => line.length)
        .join("\n");

}

    function formatEffectTooltip(text, disableUnderline = false){

    let formattedText = escapeHtml(normalizePreviewText(text));

    formattedText = formattedText.replace(
        /\\n/g,
        "<br>"
    );

    // c(#fff){Texto}
    formattedText = formattedText.replace(
        /c\((#[0-9a-fA-F]{3,8})\)\{([\s\S]+?)\}/g,
        '<span style="color:$1;">$2</span>'
    );

    if (disableUnderline) {

        // _***underline + bold + italic***_
        formattedText = formattedText.replace(
            /_\*\*\*~([\s\S]+?)~\*\*\*_/g,
            '<b><i>$1</i></b>'
        );

        // _**underline + bold**_
        formattedText = formattedText.replace(
            /_\*\*([\s\S]+?)\*\*_/g,
            '<b>$1</b>'
        );

        // **_bold + underline_**
        formattedText = formattedText.replace(
            /\*\*_([\s\S]+?)_\*\*/g,
            '<b>$1</b>'
        );

        // _~underline + italic~_
        formattedText = formattedText.replace(
            /_~([\s\S]+?)~_/g,
            '<i>$1</i>'
        );

        // ~_italic + underline_~
        formattedText = formattedText.replace(
            /~_([\s\S]+?)_~/g,
            '<i>$1</i>'
        );

        // _underline_
        formattedText = formattedText.replace(
            /_([\s\S]+?)_/g,
            '$1'
        );

    } else {

        // _***underline + bold + italic***_
        formattedText = formattedText.replace(
            /_\*\*\*~([\s\S]+?)~\*\*\*_/g,
            '<u><b><i>$1</i></b></u>'
        );

        // ***~bold + italic~***
        formattedText = formattedText.replace(
            /\*\*\*~([\s\S]+?)~\*\*\*/g,
            '<b><i>$1</i></b>'
        );

        // _**underline + bold**_
        formattedText = formattedText.replace(
            /_\*\*([\s\S]+?)\*\*_/g,
            '<u><b>$1</b></u>'
        );

        // **_bold + underline_**
        formattedText = formattedText.replace(
            /\*\*_([\s\S]+?)_\*\*/g,
            '<b><u>$1</u></b>'
        );

        // _~underline + italic~_
        formattedText = formattedText.replace(
            /_~([\s\S]+?)~_/g,
            '<u><i>$1</i></u>'
        );

        // ~_italic + underline_~
        formattedText = formattedText.replace(
            /~_([\s\S]+?)_~/g,
            '<i><u>$1</u></i>'
        );

        // _underline_
        formattedText = formattedText.replace(
            /_([\s\S]+?)_/g,
            '<u>$1</u>'
        );
    }

    // **bold**
    formattedText = formattedText.replace(
        /\*\*([\s\S]+?)\*\*/g,
        '<b>$1</b>'
    );

    // ~italic~
    formattedText = formattedText.replace(
        /~([\s\S]+?)~/g,
        '<i>$1</i>'
    );

    return formattedText;
}
}

function applyEffectEdit(){

    if(!selectedEffectKey) return;

    const oldKey = selectedEffectKey;

    const newKey =
        document.getElementById(
            "effect-id"
        ).value.trim();

    const type =
        document.getElementById(
            "effect-type"
        ).value;

    const desc =
        document.getElementById(
            "effect-desc"
        ).value;

    const noUnderlineField =
        document.getElementById(
            "effect-no-underline"
        );

    const newData = {
        desc,
        type,
        noUnderline: !!(noUnderlineField && noUnderlineField.checked)
    };

    if(oldKey !== newKey){

        effectsData = replaceEffectKeyPreservingOrder(
            effectsData,
            oldKey,
            newKey,
            newData
        );

        selectedEffectKey = newKey;

    }else{

        effectsData[oldKey] = newData;
    }

    renderEffectsList();
    renderEffectEditor();
    saveEffects();
}

function replaceEffectKeyPreservingOrder(source, oldKey, newKey, newValue){

    const nextData = {};
    const keys = Object.keys(source);

    keys.forEach(key => {
        if(key === oldKey){
            nextData[newKey] = newValue;
            return;
        }

        nextData[key] = source[key];
    });

    if(!Object.prototype.hasOwnProperty.call(nextData, newKey)){
        nextData[newKey] = newValue;
    }

    return nextData;
}

function createEffect(){

    let name = "novo_efeito";

    let counter = 1;

    while(effectsData[name]){

        name =
            `novo_efeito_${counter}`;

        counter++;
    }

    const newEffect = {

        desc:"Descrição.",

        type:"negative",

        noUnderline:false
    };

    effectsData = {
        [name]: newEffect,
        ...effectsData
    };

    selectedEffectKey = name;

    renderEffectsList();
    renderEffectEditor();
    saveEffects();
}

function duplicateEffect(){

    if(!selectedEffectKey) return;

    const original =
        effectsData[selectedEffectKey];

    let newKey =
        selectedEffectKey + "_copy";

    let counter = 1;

    while(effectsData[newKey]){

        newKey =
            `${selectedEffectKey}_copy_${counter}`;

        counter++;
    }

    effectsData[newKey] =
        JSON.parse(
            JSON.stringify(original)
        );

    selectedEffectKey = newKey;

    renderEffectsList();
    renderEffectEditor();
    saveEffects();
}

function deleteEffect(){

    if(!selectedEffectKey) return;

    const confirmed = confirm(
        `Excluir efeito?\n\n"${selectedEffectKey}"`
    );

    if(!confirmed) return;

    delete effectsData[selectedEffectKey];

    selectedEffectKey = null;

    renderEffectsList();
    renderEffectEditor();
    saveEffects();
}

function saveEffects(){

    try{ sessionStorage.setItem('jsonStudio.effectsFilter', effectsFilter); }catch(e){}

    const snapshot = JSON.parse(JSON.stringify(effectsData));

    effectsSaveQueue = effectsSaveQueue
        .then(() => writeEditorJson(
            EDITOR_API_PATHS.effects,
            snapshot
        ))
        .catch(error => {
            console.error("Erro ao salvar effects.json:", error);
        });

    return effectsSaveQueue;
}
